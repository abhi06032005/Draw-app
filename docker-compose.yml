version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: draw-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drawapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawapp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-drawapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawapp -d drawapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  http-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.http
    container_name: draw-app-http
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-drawapp}:${POSTGRES_PASSWORD:-drawapp_secret}@postgres:5432/${POSTGRES_DB:-drawapp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_change_me_in_env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  ws-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    container_name: draw-app-ws
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGIN: "*"
    ports:
      - "3002:3002"

  fe:
    build:
      context: .
      dockerfile: docker/Dockerfile.fe
    container_name: draw-app-fe
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3002}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gemini-2.0-flash}
    ports:
      - "3000:3000"
    depends_on:
      - http-backend
      - ws-backend

volumes:
  postgres_data:
